services:
  token-usage-postgres:
    image: postgres:16-alpine
    container_name: pi-token-usage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pi_token_usage}
      POSTGRES_USER: ${POSTGRES_USER:-pi_token_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pi_token_tracker}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pi-token-usage-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pi-token-usage-postgres:
